backend:
  name: github
  repo: mortoneer/ronan-schoolhouse-website
  branch: main
  base_url: https://sveltia-cms-auth.steve-kane-189.workers.dev

media_folder: images
public_folder: images

collections:
  - name: content
    label: Website Text
    files:
      - label: Home Page
        name: home
        file: content.json
        fields:
          # --- Hero ---
          - { label: "Hero Eyebrow", name: hero_emdash, widget: string, hint: "e.g. A beloved school. A shared future." }
          - { label: "Hero Title", name: hero_title, widget: string }
          - { label: "Hero Intro Paragraph", name: hero_intro, widget: text }
          - { label: "Hero Quiet Text", name: hero_tiny, widget: string, hint: "Small line below the CTA button." }

          # --- Yellow Banner ---
          - { label: "Banner Item 1", name: hr_1, widget: string, hint: "e.g. A place to live" }
          - { label: "Banner Item 2", name: hr_2, widget: string, hint: "e.g. A place to gather" }
          - { label: "Banner Item 3", name: hr_3, widget: string, hint: "e.g. A place to play" }

          # --- Our Vision / Story ---
          - { label: "Vision Section Eyebrow", name: story_emdash, widget: string, hint: "e.g. Our vision" }
          - { label: "Vision Heading", name: story_heading, widget: string, hint: "e.g. Honoring a School's History. Imagining a New Future." }
          - { label: "Vision Lead Sentence", name: story_large, widget: string, hint: "Larger lead sentence displayed above the body paragraphs." }
          - { label: "Vision Body Paragraph 1", name: story_p1, widget: text }
          - { label: "Vision Body Paragraph 2", name: story_p2, widget: text }
          - { label: "Vision Body Paragraph 3", name: story_p3, widget: text }

          # --- Goals / Possibilities ---
          - { label: "Goals Section Eyebrow", name: goals_emdash, widget: string, hint: "e.g. What we're working toward" }
          - { label: "Goals Title", name: goals_title, widget: string, hint: "e.g. One schoolhouse. So many possibilities." }

      - label: What is visibile on the page
        name: visibility
        file: visibility.json
        fields:
          - label: Visible Projects
            name: visible_projects
            widget: relation
            hint: A beloved school. A shared future.
            collection: "projects"
            value_field: "{{slug}}"
            search_fields: ["title"]
            display_fields: [title]
            multiple: true

  - name: goals
    label: Goals
    folder: goals
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Category Number, name: category, widget: string, hint: "e.g., 01 / LIVE" }
      - { label: Project Title, name: title, widget: string, hint: Affordable senior apartments }
      - { label: Description, name: description, widget: text, hint: "Our plan starts with homes for older adults: an affordable place to live in a building with deep community roots." }

  - name: projects
    label: Upcoming Projects
    folder: projects
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Category Number, name: category, widget: string, hint: "e.g., 01 / PLUMBING" }
      - { label: Project Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Status, name: status, widget: string, default: Upcoming project }
      - { label: Ways to Participate, name: sponsor_text, widget: text }
